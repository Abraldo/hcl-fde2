server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

spring:
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_USERNAME:cold_chain}
    password: ${ORACLE_PASSWORD:change-me}
    driver-class-name: oracle.jdbc.OracleDriver
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-to-a-long-random-secret-123456}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:4200}
